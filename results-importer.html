<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Perry Results Importer</title>
<style>
body{font-family:system-ui,Segoe UI,Roboto,Arial,sans-serif;margin:0;padding:16px;background:#111;color:#eee}
h1{font-size:20px;margin:0 0 4px;color:#fd0}.sub{color:#999;font-size:13px;margin-bottom:14px}
.card{background:#1c1c1c;border:1px solid #333;border-radius:10px;padding:12px;margin-bottom:12px}
label{font-size:12px;color:#aaa;display:block;margin:6px 0 2px}
input[type=text],input[type=date],input[type=number],textarea{background:#000;color:#fff;border:1px solid #444;border-radius:6px;padding:7px;font-size:14px;width:100%;box-sizing:border-box}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>div{flex:1;min-width:140px}
button{background:#fd0;color:#000;border:0;border-radius:6px;padding:9px 14px;font-weight:700;cursor:pointer;margin:6px 6px 0 0}
button.alt{background:#333;color:#fff}
table{border-collapse:collapse;width:100%;font-size:13px}th,td{border-bottom:1px solid #333;padding:4px 6px;text-align:left}th{color:#fd0}
.wrap{overflow-x:auto;max-height:420px;overflow-y:auto}.warn{color:#f90;font-size:13px}
#print{display:none}
@media print{body{background:#fff;color:#000}.noprint{display:none!important}#print{display:block}
#print h2{font-size:16px;margin:14px 0 4px;page-break-after:avoid}#print table{font-size:11px}#print th,#print td{border-bottom:1px solid #999;color:#000}}
</style></head><body>
<div class="noprint">
<h1>Perry Results Importer</h1>
<div class="sub">Load your Hytek-style results pages (.htm / .txt). Everything runs in this page; nothing is uploaded.</div>
<div class="card">
 <label>Results files (pick several to add a whole season)</label><input type="file" id="files" multiple accept=".htm,.html,.txt">
 <label>...or paste results text</label><textarea id="paste" rows="3"></textarea>
 <div class="row"><div><label>School to keep</label><input type="text" id="school" value="Perry"></div>
 <div><label>Meet date(s) - e.g. 5/27/26 or 5/27 & 5/29/26</label><input type="text" id="datetxt" placeholder="5/27/26, 5/21-5/23/26, or 5/27 & 5/29/26"></div>
 <div><label>Points credit</label><select id="pcredit" style="background:#000;color:#fff;border:1px solid #444;border-radius:6px;padding:7px;font-size:14px;width:100%"><option value="1">Full points</option><option value="0.5">Half points (9th/10th invitational)</option></select></div>
 <div><label>Season year (spring = grad year of seniors)</label><input type="number" id="season" placeholder="auto from title"></div></div>
 <button id="add">Add meet(s)</button><button class="alt" id="clear">Clear all</button>
 <div id="msg" class="warn"></div>
</div>
<div class="card"><b>Results log</b> <span id="count" style="color:#999"></span>
 <div><button id="dl1">Download results log (CSV)</button><button id="dl2">Download bests by event/grade (CSV)</button><button class="alt" id="pr">Print banquet sheet</button></div>
 <div class="wrap"><table id="tbl"></table></div></div>
</div>
<div id="print"></div>
<script>
// PARSE_START
const GRADE = { FR: 9, SO: 10, JR: 11, SR: 12 };
const FIELD = /jump|vault|put|discus|javelin|hammer/i;

function markValue(m, field) {
  if (!/\d/.test(m)) return null;
  if (field && m.includes('-') && !m.includes(':')) { const [f, i] = m.split('-'); return parseFloat(f) * 12 + (parseFloat(i) || 0); }
  const p = m.replace(/[^\d:.]/g, '').split(':').map(Number);
  return p.length === 2 ? p[0] * 60 + p[1] : p[0];
}

// Strips leading '0:' minutes and trims whitespace
function cleanMark(m) {
  if (!m) return '';
  let s = String(m).trim();
  return s.replace(/^0+:0*/, '');
}

// Tidies event names: "Shot Put - 12lb" -> "Shot Put", "100 Meter - Wheelchair" -> "Seated 100m"
function normEvent(e) {
  e = e.trim();
  if (/wheelchair|seated/i.test(e)) {
    const d = e.match(/^(\d+)\s*(?:Meter|m)\b/i); if (d) return 'Seated ' + d[1] + 'm';
    const f = e.match(/^(Shot Put|Discus|Javelin|Club)/i); if (f) return 'Seated ' + f[1];
  }
  return e.replace(/^(Shot Put|Discus|Javelin|Hammer)\s*-\s*[\d.]+\s*(?:lbs?|kg)\s*$/i, '$1');
}

  str = str.replace(/\s*(?:&|\band\b|,)\s*/gi, '-');
